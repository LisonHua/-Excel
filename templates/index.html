<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel抽奖系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f7f9fc; }
        .card { border: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); }
        .winner-item { font-size: 1.2rem; font-weight: 600; color: #0d6efd; }
        .loading-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.75);
            z-index: 9999;
        }
        .loading-box {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 text-center mb-4">Excel 抽奖系统</h1>

                    <div class="mb-3">
                        <label for="excelFile" class="form-label">1. 导入人员名单Excel</label>
                        <input class="form-control" type="file" id="excelFile" accept=".xlsx,.xls">
                        <div class="form-text">请确保Excel里至少有一列是姓名字段。</div>
                    </div>

                    <div class="mb-3">
                        <label for="nameColumn" class="form-label">2. 选择姓名列</label>
                        <select class="form-select" id="nameColumn" disabled>
                            <option value="">请先上传Excel</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="winnerCount" class="form-label">3. 设置中奖人数</label>
                        <input type="number" class="form-control" id="winnerCount" min="1" value="1">
                    </div>

                    <button id="drawButton" class="btn btn-primary w-100" disabled>开始抽奖</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="loading-mask" id="loadingMask">
    <div class="loading-box">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 mb-0">处理中，请稍候...</p>
    </div>
</div>

<div class="modal fade" id="winnerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">🎉 抽奖结果</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="summaryText" class="text-muted mb-3"></p>
                <ul id="winnerList" class="list-group"></ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const excelFileInput = document.getElementById('excelFile');
    const nameColumnSelect = document.getElementById('nameColumn');
    const winnerCountInput = document.getElementById('winnerCount');
    const drawButton = document.getElementById('drawButton');
    const loadingMask = document.getElementById('loadingMask');
    const winnerModal = new bootstrap.Modal(document.getElementById('winnerModal'));
    const winnerList = document.getElementById('winnerList');
    const summaryText = document.getElementById('summaryText');

    let uploadedFilename = '';

    function setLoading(isLoading) {
        loadingMask.style.display = isLoading ? 'block' : 'none';
    }

    excelFileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        try {
            setLoading(true);
            const response = await fetch('/lottery/upload', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || '上传失败');
            }

            uploadedFilename = result.filename;
            nameColumnSelect.innerHTML = '<option value="">请选择姓名列</option>';
            result.columns.forEach((column) => {
                const option = document.createElement('option');
                option.value = column;
                option.textContent = column;
                nameColumnSelect.appendChild(option);
            });
            nameColumnSelect.disabled = false;
            drawButton.disabled = false;
        } catch (error) {
            alert(error.message);
            uploadedFilename = '';
            nameColumnSelect.innerHTML = '<option value="">请先上传Excel</option>';
            nameColumnSelect.disabled = true;
            drawButton.disabled = true;
        } finally {
            setLoading(false);
        }
    });

    drawButton.addEventListener('click', async () => {
        const winnerCount = parseInt(winnerCountInput.value, 10);
        const selectedColumn = nameColumnSelect.value;

        if (!uploadedFilename) {
            alert('请先上传Excel文件');
            return;
        }
        if (!selectedColumn) {
            alert('请选择姓名列');
            return;
        }
        if (!winnerCount || winnerCount < 1) {
            alert('请输入有效的中奖人数');
            return;
        }

        try {
            setLoading(true);
            const response = await fetch('/lottery/draw', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    filename: uploadedFilename,
                    column: selectedColumn,
                    winner_count: winnerCount
                })
            });
            const result = await response.json();
            if (!response.ok) {
                throw new Error(result.error || '抽奖失败');
            }

            winnerList.innerHTML = '';
            result.winners.forEach((name, index) => {
                const li = document.createElement('li');
                li.className = 'list-group-item winner-item';
                li.textContent = `${index + 1}. ${name}`;
                winnerList.appendChild(li);
            });
            summaryText.textContent = `参与人数：${result.total}，中奖人数：${result.winners.length}`;
            winnerModal.show();
        } catch (error) {
            alert(error.message);
        } finally {
            setLoading(false);
        }
    });
</script>
</body>
</html>
